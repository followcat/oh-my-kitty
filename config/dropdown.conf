# Normal kitty profile managed as a dropdown by ~/.local/bin/kitty-quick-access-toggle.
font_family Agave Nerd Font
font_size 14.0
modify_font cell_width 100%
shell_integration enabled
window_padding_width 0
single_window_margin_width 0
background_opacity 0.88
hide_window_decorations titlebar-and-borders
remember_window_size no
remember_window_position no
scrollback_lines 1000000
allow_remote_control socket-only
copy_on_select clipboard
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary read-clipboard read-primary
detect_urls yes
underline_hyperlinks always
foreground #dddddd
background #000000
cursor #cccccc
selection_background #fffacd
selection_foreground #000000
wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 0.7
pixel_scroll yes
momentum_scroll 0.85
enabled_layouts tall,fat,grid,stack,splits

map ctrl+shift+f1 launch --type=overlay @HOME@/.local/bin/kitty-shortcuts-help
map ctrl+shift+t launch --type=tab --cwd=@HOME@ /usr/bin/zsh
map ctrl+shift+w close_tab
map ctrl+page_down next_tab
map ctrl+tab next_tab
map ctrl+page_up previous_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up move_tab_backward
map ctrl+f1 goto_tab 1
map ctrl+f2 goto_tab 2
map ctrl+f3 goto_tab 3
map ctrl+f4 goto_tab 4
map ctrl+f5 goto_tab 5
map ctrl+f6 goto_tab 6
map ctrl+f7 goto_tab 7
map ctrl+f8 goto_tab 8
map ctrl+f9 goto_tab 9
map ctrl+f10 goto_tab 10
map ctrl+f12 goto_tab -1
map ctrl+shift+minus launch --location=hsplit
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+enter launch --location=vsplit
map ctrl+shift+l next_layout
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+z scroll_to_prompt -1 3
map ctrl+shift+x scroll_to_prompt 1
map ctrl+shift+a scroll_to_prompt 0
map ctrl+shift+/ search_scrollback
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_non_empty_command_output
map ctrl+shift+u show_last_visited_command_output
map ctrl+shift+o kitten hints --type url
map ctrl+shift+p kitten hints --type path --program -
map ctrl+shift+e kitten hints --type word
map ctrl+shift+m create_marker
map ctrl+alt+m remove_marker

map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+up launch --type=background @HOME@/.local/bin/kitty-quick-access-resize-height 40
map ctrl+down launch --type=background @HOME@/.local/bin/kitty-quick-access-resize-height -40
map ctrl+left resize_window wider 3
map ctrl+right resize_window narrower 3
map ctrl+alt+up resize_window taller 3
map ctrl+alt+down resize_window shorter 3
map ctrl+alt+left resize_window narrower 3
map ctrl+alt+right resize_window wider 3

tab_bar_edge bottom
tab_bar_style separator
tab_bar_align left
tab_bar_min_tabs 1
tab_separator "   "
active_tab_foreground #1a1a1a
active_tab_background #f39c12
active_tab_font_style bold
inactive_tab_foreground #b8b8b8
inactive_tab_background #1f1f1f
inactive_tab_font_style normal
tab_bar_background #1a1a1a
