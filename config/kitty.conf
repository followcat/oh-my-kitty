# Global kitty shortcuts. The quick-access terminal has its own profile, so
# bindings needed in normal kitty windows belong here as well.
shell_integration enabled
enabled_layouts tall,fat,grid,stack,splits

map ctrl+shift+f1 launch --type=overlay @HOME@/.local/bin/kitty-shortcuts-help
map ctrl+f13 launch --type=overlay @HOME@/.local/bin/kitty-shortcuts-help
map ctrl+shift+comma launch --type=overlay @HOME@/.local/bin/kitty-shortcuts-help
map ctrl+shift+i launch --type=window --location=hsplit --bias=30 --cwd=@HOME@ --env=KITTY_AICHAT_SOURCE_WINDOW_ID=$KITTY_WINDOW_ID @HOME@/.local/bin/kitty-aichat
map ctrl+shift+y launch --type=window --location=hsplit --bias=30 --cwd=@HOME@ --env=KITTY_AICHAT_SOURCE_WINDOW_ID=$KITTY_WINDOW_ID @HOME@/.local/bin/kitty-aichat shell
map ctrl+shift+s launch --type=window --location=hsplit --bias=30 --cwd=@HOME@ --env=KITTY_AICHAT_SOURCE_WINDOW_ID=$KITTY_WINDOW_ID --stdin-source=@selection @HOME@/.local/bin/kitty-aichat selection
map ctrl+shift+alt+s launch --type=window --location=hsplit --bias=30 --cwd=@HOME@ --env=KITTY_AICHAT_SOURCE_WINDOW_ID=$KITTY_WINDOW_ID --stdin-source=@selection @HOME@/.local/bin/kitty-aichat shell-input
map ctrl+shift+r launch --type=window --location=hsplit --bias=30 --cwd=@HOME@ --env=KITTY_AICHAT_SOURCE_WINDOW_ID=$KITTY_WINDOW_ID --stdin-source=@last_cmd_output @HOME@/.local/bin/kitty-aichat last-output
map ctrl+shift+k launch --type=window --location=hsplit --bias=30 --cwd=@HOME@ --env=KITTY_AICHAT_SOURCE_WINDOW_ID=$KITTY_WINDOW_ID --stdin-source=@screen @HOME@/.local/bin/kitty-aichat screen
map ctrl+shift+minus launch --location=hsplit
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+enter launch --location=vsplit
map ctrl+shift+l next_layout

map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

map ctrl+up resize_window taller 3
map ctrl+down resize_window shorter 3
map ctrl+left resize_window narrower 3
map ctrl+right resize_window wider 3

map ctrl+shift+z scroll_to_prompt -1 3
map ctrl+shift+x scroll_to_prompt 1
map ctrl+shift+a scroll_to_prompt 0
map ctrl+shift+/ search_scrollback
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_non_empty_command_output
map ctrl+shift+u show_last_visited_command_output
map ctrl+shift+m create_marker
map ctrl+alt+m remove_marker
