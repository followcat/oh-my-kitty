# Global kitty shortcuts. The quick-access terminal has its own profile, so
# bindings needed in normal kitty windows belong here as well.
map ctrl+shift+minus launch --location=hsplit
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+enter launch --location=vsplit

map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

map ctrl+up resize_window taller 3
map ctrl+down resize_window shorter 3
map ctrl+left resize_window narrower 3
map ctrl+right resize_window wider 3
